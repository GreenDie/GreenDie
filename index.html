<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1513">
<meta name="description" content="Zeiterfassung: Arbeitsbeginn, Pausen, Feierabend und Auftragszeiten mit Stoppuhr. Läuft offline im Browser.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Zeiterfassung</title>
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#E9ECE8; --card:#FBFCFA; --card-2:#F2F5F1;
  --ink:#14201C; --muted:#5C6B65; --line:#CBD3CE; --line-strong:#9FACA6;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D9E8E4;
  --run:#9A5B08; --run-soft:#F6E6CB;
  --danger:#A8392B;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --r:5px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1513; --card:#17211E; --card-2:#1E2A26;
    --ink:#E7EDE9; --muted:#94A39C; --line:#2A3833; --line-strong:#3D4F49;
    --accent:#4CBFAC; --accent-ink:#07211D; --accent-soft:#1D3733;
    --run:#E4A44B; --run-soft:#3A2C13;
    --danger:#E08479;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#17211E; --card-2:#1E2A26;
  --ink:#E7EDE9; --muted:#94A39C; --line:#2A3833; --line-strong:#3D4F49;
  --accent:#4CBFAC; --accent-ink:#07211D; --accent-soft:#1D3733;
  --run:#E4A44B; --run-soft:#3A2C13;
  --danger:#E08479;
}
:root[data-theme="light"]{
  --bg:#E9ECE8; --card:#FBFCFA; --card-2:#F2F5F1;
  --ink:#14201C; --muted:#5C6B65; --line:#CBD3CE; --line-strong:#9FACA6;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D9E8E4;
  --run:#9A5B08; --run-soft:#F6E6CB;
  --danger:#A8392B;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:920px;margin:0 auto;padding:14px 14px 64px;display:flex;flex-direction:column;gap:14px}

/* ---------- Kopf ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.brand{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-family:var(--mono);color:var(--muted);margin:0}
.brand b{color:var(--ink);font-weight:600}
.ghost{
  font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:var(--r);padding:5px 10px;cursor:pointer
}
.ghost:hover{border-color:var(--line-strong);color:var(--ink)}

/* ---------- Datumsleiste ---------- */
.datebar{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:8px
}
.datebar .nav{
  width:38px;height:38px;flex:0 0 auto;font-size:1.1rem;line-height:1;
  background:var(--card-2);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);cursor:pointer
}
.datebar .nav:hover{background:var(--accent-soft);border-color:var(--accent)}
.datefield{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.datefield .weekday{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.datefield input{
  font-family:var(--mono);font-size:1.02rem;font-weight:600;color:var(--ink);background:none;border:0;
  text-align:center;padding:0;width:100%;max-width:200px
}
.datefield input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}

/* ---------- Karten ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card > h2{
  margin:0 0 12px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  font-family:var(--mono);color:var(--muted);font-weight:600;
  border-bottom:1px solid var(--line);padding-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.cols{display:grid;gap:14px}
@media (min-width:760px){ .cols{grid-template-columns:1fr 1fr} }

/* ---------- Stempelzeilen ---------- */
.stamp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.stamp:last-of-type{border-bottom:0}
.stamp .lbl{flex:1;min-width:0;font-size:.86rem;color:var(--muted)}
.stamp .lbl b{display:block;color:var(--ink);font-weight:600;font-size:.95rem}
input[type=time]{
  font-family:var(--mono);font-size:1.35rem;font-weight:600;letter-spacing:.02em;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 8px;min-width:112px;text-align:center;font-variant-numeric:tabular-nums
}
input[type=time]:focus-visible,input[type=date]:focus-visible,input[type=text]:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
.now{
  flex:0 0 auto;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--card-2);color:var(--muted);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 9px;cursor:pointer
}
.now:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* Pausen */
.pause-row{display:flex;align-items:center;gap:8px 10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.pause-row .tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%}
.pause-row input[type=time]{font-size:1.1rem;min-width:96px}
.pgrp{display:flex;align-items:center;gap:6px}
.pgrp > span{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:24px}
.pause-row .icon{margin-left:auto}
.sep{color:var(--muted);font-family:var(--mono)}
.icon{
  flex:0 0 auto;width:32px;height:32px;border:1px solid var(--line);background:var(--card-2);
  color:var(--muted);border-radius:var(--r);cursor:pointer;font-size:1rem;line-height:1
}
.icon:hover{color:var(--danger);border-color:var(--danger)}
.addline{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:.85rem;font-weight:600;border-radius:var(--r);padding:9px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink)
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{background:var(--run-soft);border-color:var(--run);color:var(--run)}

/* ---------- Summen ---------- */
.sums{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:560px){ .sums{grid-template-columns:repeat(4,1fr)} }
.sum{background:var(--card);padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.sum span{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sum strong{font-family:var(--mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum.net strong{color:var(--accent)}
.sum small{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* ---------- Aufträge ---------- */
.job{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px;background:var(--card-2)}
.job.running{border-color:var(--run);box-shadow:inset 3px 0 0 var(--run)}
.jfields{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.job .names{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:0 0 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.names .field{flex:1 1 180px}
.names .field.birth{flex:0 1 152px}
.field span{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{
  font:inherit;font-size:.95rem;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;width:100%
}
.field textarea{min-height:62px;resize:vertical;line-height:1.4}
.field.birth input{font-family:var(--mono);font-variant-numeric:tabular-nums}
.job .times{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.job .times input[type=time]{font-size:1.05rem;min-width:92px;background:var(--card)}
.dur{
  font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;
  margin-left:auto;padding:4px 9px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)
}
.job.running .dur{background:var(--run-soft);border-color:var(--run);color:var(--run)}
.job .times .btn{margin-left:0}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0 12px}

/* Laufband */
.ticker{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--run-soft);border:1px solid var(--run);color:var(--run);
  border-radius:var(--r);padding:9px 11px;font-size:.85rem
}
.ticker .dot{width:9px;height:9px;border-radius:50%;background:var(--run);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){ .ticker .dot{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ticker .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
.ticker .t{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.ticker button{font:inherit;font-size:.78rem;font-weight:600;background:var(--run);color:var(--card);border:0;border-radius:var(--r);padding:6px 10px;cursor:pointer}

/* Notiz */
textarea{
  font:inherit;font-size:.95rem;width:100%;min-height:74px;resize:vertical;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:9px
}

/* Monatsübersicht */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
summary{
  cursor:pointer;padding:13px 14px;font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:600
}
summary::marker{color:var(--line-strong)}
.tablewrap{overflow-x:auto;padding:0 14px 14px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
tbody td{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody td:first-child{font-family:var(--sans)}
tfoot td{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;border-top:2px solid var(--line-strong);border-bottom:0}
tr.today td{background:var(--accent-soft)}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.foot{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
.hint{font-size:.78rem;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <p class="brand"><b>Zeiterfassung</b> · Stempelkarte</p>
    <button class="ghost" id="themeBtn" type="button">Ansicht: Automatisch</button>
  </div>

  <div id="ticker"></div>

  <div class="datebar">
    <button class="nav" id="prevDay" type="button" title="Vortag" aria-label="Vortag">‹</button>
    <label class="datefield">
      <span class="weekday" id="weekday">–</span>
      <input type="date" id="date">
    </label>
    <button class="nav" id="nextDay" type="button" title="Folgetag" aria-label="Folgetag">›</button>
    <button class="ghost" id="todayBtn" type="button">Heute</button>
  </div>

  <div class="sums" id="sums"></div>

  <div class="cols">
    <section class="card">
      <h2>Arbeitstag</h2>

      <div class="stamp">
        <label class="lbl" for="f-start"><b>Arbeitsbeginn</b>Kommen</label>
        <input type="time" id="f-start" data-field="start">
        <button class="now" type="button" data-now="start">Jetzt</button>
      </div>

      <div id="breaks"></div>

      <div class="stamp">
        <label class="lbl" for="f-end"><b>Arbeitsende</b>Gehen</label>
        <input type="time" id="f-end" data-field="end">
        <button class="now" type="button" data-now="end">Jetzt</button>
      </div>

      <div class="addline">
        <button class="btn" id="pauseToggle" type="button">Pause starten</button>
        <button class="btn" id="addBreak" type="button">+ Pause</button>
      </div>
      <p class="hint" id="dayHint"></p>
    </section>

    <section class="card">
      <h2>Aufträge</h2>
      <div id="jobs"></div>
      <div class="addline">
        <button class="btn primary" id="addJob" type="button">+ Auftrag</button>
      </div>
    </section>
  </div>

  <section class="card">
    <h2>Notiz zum Tag</h2>
    <textarea id="note" placeholder="Material, Fahrtzeit, Besonderheiten …"></textarea>
  </section>

  <details id="monthBox">
    <summary id="monthSummary">Monatsübersicht</summary>
    <div class="tablewrap" id="monthTable"></div>
  </details>

  <section class="card">
    <h2>Daten</h2>
    <div class="tools">
      <button class="btn" id="csvDays" type="button">CSV: Tage (Monat)</button>
      <button class="btn" id="csvJobs" type="button">CSV: Aufträge (Monat)</button>
      <button class="btn" id="backup" type="button">Sicherung speichern</button>
      <button class="btn" id="restoreBtn" type="button">Sicherung laden</button>
      <button class="btn" id="clearDay" type="button">Tag leeren</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <p class="hint">Alles bleibt auf diesem Gerät (Browser-Speicher). Sicherung regelmäßig speichern — beim Löschen der Browserdaten sind die Zeiten sonst weg.</p>
  </section>

  <p class="foot">Zeiten in Stunden:Minuten. Über Mitternacht wird korrekt gerechnet.</p>
</div>

<script>
(function(){
"use strict";

/* ---------------- Speicher ---------------- */
var KEY = "zeiterfassung.v1";
var db = { days:{} };
var current = isoToday();
var saveTimer = null;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && p.days) db = p;
    }
  }catch(e){ /* beschädigte Daten ignorieren, leer starten */ }
}
function writeNow(){                       // sofort auf die Platte
  clearTimeout(saveTimer);
  saveTimer = null;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert("Speichern nicht möglich: " + e.message); }
}
function save(){                           // beim Tippen gebündelt
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 120);
}
// Nichts verlieren, wenn die App weggewischt oder die Seite geschlossen wird
window.addEventListener("pagehide", writeNow);
document.addEventListener("visibilitychange", function(){ if(document.hidden) writeNow(); });

/* ---------------- Zeit-Helfer ---------------- */
function pad(n){ return String(n).padStart(2,"0"); }
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function isoToday(){ return isoOf(new Date()); }
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function toMin(s){
  if(!s || !/^\d{1,2}:\d{2}$/.test(s)) return null;
  var p = s.split(":"), h = +p[0], m = +p[1];
  if(h>23 || m>59) return null;
  return h*60+m;
}
function span(a,b){                       // Minuten von a bis b, über Mitternacht hinweg
  if(a===null || b===null) return null;
  var d = b-a;
  if(d<0) d += 1440;
  return d;
}
function hm(min){                          // 455 -> "7:35"
  if(min===null || isNaN(min)) return "–";
  var neg = min<0, x = Math.abs(Math.round(min));
  return (neg?"-":"") + Math.floor(x/60) + ":" + pad(x%60);
}
function hms(sec){                         // laufende Uhr
  var x = Math.max(0, Math.floor(sec));
  return pad(Math.floor(x/3600)) + ":" + pad(Math.floor(x/60)%60) + ":" + pad(x%60);
}
function dec(min){ return (min/60).toFixed(2).replace(".", ","); }

/* ---------------- Tagesdaten ---------------- */
function day(iso){
  var d = db.days[iso];
  if(!d){
    d = { start:"", end:"", breaks:[{from:"",to:""}], jobs:[], note:"" };
    db.days[iso] = d;
  }
  if(!d.breaks) d.breaks = [];
  if(!d.jobs) d.jobs = [];
  return d;
}
function isEmptyDay(d){
  if(!d) return true;
  if(d.start || d.end || (d.note||"").trim()) return false;
  if(d.jobs.length) return false;
  return !d.breaks.some(function(b){ return b.from || b.to; });
}
function jobSec(j){
  if(j.running && j.startedAt) return (Date.now()-j.startedAt)/1000;
  if(typeof j.sec === "number") return j.sec;
  var s = span(toMin(j.start), toMin(j.end));
  return s===null ? 0 : s*60;
}
function totals(d){
  var att = span(toMin(d.start), toMin(d.end));
  var br = 0;
  d.breaks.forEach(function(b){
    var s = span(toMin(b.from), toMin(b.to));
    if(s!==null) br += s;
  });
  var net = att===null ? null : Math.max(0, att-br);
  var jm = 0;
  d.jobs.forEach(function(j){ jm += jobSec(j)/60; });
  return { att:att, br:br, net:net, jobs:jm };
}
function runningJob(){
  for(var iso in db.days){
    var js = db.days[iso].jobs || [];
    for(var i=0;i<js.length;i++) if(js[i].running) return { iso:iso, job:js[i] };
  }
  return null;
}
function stopAllRunning(){
  var r;
  while((r = runningJob())) finishJob(r.job);
}
function finishJob(j){
  j.sec = Math.round((Date.now() - j.startedAt)/1000);
  j.end = nowHM();
  j.running = false;
  j.startedAt = null;
}

/* ---------------- DOM ---------------- */
var $ = function(id){ return document.getElementById(id); };
var WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function renderAll(){
  var d = day(current), dt = parseISO(current);
  $("date").value = current;
  $("weekday").textContent = WD[dt.getDay()] + (current===isoToday() ? " · heute" : "");
  $("f-start").value = d.start || "";
  $("f-end").value = d.end || "";
  $("note").value = d.note || "";
  renderBreaks(d);
  renderJobs(d);
  renderSums();
  renderTicker();
  renderMonth();
}

function renderBreaks(d){
  var box = $("breaks");
  box.innerHTML = "";
  d.breaks.forEach(function(b, i){
    var row = document.createElement("div");
    row.className = "pause-row";
    row.innerHTML =
      '<div class="tag">Pause ' + (d.breaks.length>1 ? (i+1) : "") + '</div>' +
      '<span class="pgrp"><span>von</span>' +
        '<input type="time" data-break="' + i + '" data-key="from" value="' + (b.from||"") + '" aria-label="Pause Beginn">' +
        '<button class="now" type="button" data-nowbreak="' + i + '" data-key="from">Jetzt</button></span>' +
      '<span class="pgrp"><span>bis</span>' +
        '<input type="time" data-break="' + i + '" data-key="to" value="' + (b.to||"") + '" aria-label="Pause Ende">' +
        '<button class="now" type="button" data-nowbreak="' + i + '" data-key="to">Jetzt</button></span>' +
      '<button class="icon" type="button" data-delbreak="' + i + '" title="Pause löschen" aria-label="Pause löschen">×</button>';
    box.appendChild(row);
  });
  var open = d.breaks.some(function(b){ return b.from && !b.to; });
  $("pauseToggle").textContent = open ? "Pause beenden" : "Pause starten";
  $("pauseToggle").className = open ? "btn warn" : "btn";
}

function esc(s){
  return String(s||"").replace(/[&<>"]/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];
  });
}

function renderJobs(d){
  var box = $("jobs");
  box.innerHTML = "";
  if(!d.jobs.length){
    box.innerHTML = '<p class="empty">Noch kein Auftrag erfasst. Mit „+ Auftrag“ anlegen, „Start“ beginnt die Zeitmessung.</p>';
    return;
  }
  d.jobs.forEach(function(j, i){
    var el = document.createElement("div");
    el.className = "job" + (j.running ? " running" : "");
    el.innerHTML =
      '<div class="jfields">' +
        '<div class="names">' +
          '<label class="field"><span>Kunde</span>' +
            '<input type="text" data-job="'+i+'" data-key="customer" value="'+esc(j.customer)+'" placeholder="Kundenname"></label>' +
          '<label class="field birth"><span>Geburtsdatum</span>' +
            '<input type="text" data-job="'+i+'" data-key="birth" value="'+esc(j.birth)+'" placeholder="TT.MM.JJJJ" inputmode="numeric"></label>' +
        '</div>' +
        '<label class="field"><span>Auftrag / Tätigkeit</span>' +
          '<textarea data-job="'+i+'" data-key="task" placeholder="Was wurde gemacht?">'+esc(j.task)+'</textarea></label>' +
        '<label class="field"><span>Material</span>' +
          '<textarea data-job="'+i+'" data-key="material" placeholder="Verbautes Material, Teile, Mengen …">'+esc(j.material)+'</textarea></label>' +
      '</div>' +
      '<div class="times">' +
        '<input type="time" data-job="'+i+'" data-key="start" value="'+(j.start||"")+'" aria-label="Auftrag Beginn">' +
        '<span class="sep">–</span>' +
        '<input type="time" data-job="'+i+'" data-key="end" value="'+(j.end||"")+'" aria-label="Auftrag Ende">' +
        '<button class="btn '+(j.running?"warn":"primary")+'" type="button" data-toggle="'+i+'">'+(j.running?"Stopp":"Start")+'</button>' +
        '<button class="icon" type="button" data-deljob="'+i+'" title="Auftrag löschen" aria-label="Auftrag löschen">×</button>' +
        '<span class="dur" data-dur="'+i+'">'+jobDurText(j)+'</span>' +
      '</div>';
    box.appendChild(el);
  });
}
function jobDurText(j){
  if(j.running) return hms(jobSec(j));
  var sec = jobSec(j);
  return sec>0 ? hm(sec/60) : "–";
}

function renderSums(){
  var d = day(current), t = totals(d);
  var diff = t.net===null ? null : t.net - t.jobs;
  $("sums").innerHTML =
    box("Anwesend", hm(t.att), d.start && d.end ? d.start+"–"+d.end : "Beginn & Ende fehlen") +
    box("Pause", t.br ? hm(t.br) : "0:00", t.br ? dec(t.br)+" h" : "keine") +
    box("Arbeitszeit", hm(t.net), t.net===null ? "" : dec(t.net)+" h", "net") +
    box("Auf Aufträge", hm(t.jobs), diff===null ? "" : (Math.abs(diff)<1 ? "vollständig gebucht" : (diff>0 ? hm(diff)+" offen" : hm(-diff)+" zu viel")));
  function box(label, value, sub, cls){
    return '<div class="sum '+(cls||"")+'"><span>'+label+'</span><strong>'+value+'</strong><small>'+(sub||"&nbsp;")+'</small></div>';
  }
  var t2 = totals(day(current));
  $("dayHint").textContent = (t2.att!==null && t2.att<t2.br) ? "Pausen sind länger als die Anwesenheit – bitte Zeiten prüfen." : "";
}

function renderTicker(){
  var r = runningJob(), box = $("ticker");
  if(!r){ box.innerHTML = ""; box.className = ""; return; }
  box.className = "ticker";
  var name = [r.job.customer, flat(r.job.task)].filter(Boolean).join(" · ") || "Auftrag ohne Namen";
  if(r.iso !== current) name += " (" + deDate(r.iso) + ")";
  box.innerHTML =
    '<span class="dot"></span>' +
    '<span class="who">'+esc(name)+'</span>' +
    '<span class="t" id="tickerTime">'+hms(jobSec(r.job))+'</span>' +
    '<button type="button" id="tickerStop">Stopp</button>';
  $("tickerStop").onclick = function(){
    stopAllRunning(); save(); renderAll();
  };
}

function renderMonth(){
  var ym = current.slice(0,7);
  var list = Object.keys(db.days).filter(function(iso){
    return iso.slice(0,7)===ym && !isEmptyDay(db.days[iso]);
  }).sort();
  var d0 = parseISO(current);
  $("monthSummary").textContent = "Monatsübersicht · " + MON[d0.getMonth()] + " " + d0.getFullYear();

  if(!list.length){
    $("monthTable").innerHTML = '<p class="empty">Für diesen Monat ist noch nichts erfasst.</p>';
    return;
  }
  var sumNet = 0, sumBr = 0, sumJobs = 0, rows = "";
  list.forEach(function(iso){
    var d = db.days[iso], t = totals(d), dt = parseISO(iso);
    sumNet += t.net || 0; sumBr += t.br; sumJobs += t.jobs;
    rows +=
      '<tr class="'+(iso===current?"today":"")+'">' +
        '<td>'+WD[dt.getDay()].slice(0,2)+', '+pad(dt.getDate())+"."+pad(dt.getMonth()+1)+".</td>" +
        '<td>'+(d.start||"–")+'</td><td>'+(d.end||"–")+'</td>' +
        '<td>'+(t.br?hm(t.br):"–")+'</td>' +
        '<td>'+hm(t.net)+'</td>' +
        '<td>'+(t.net===null?"–":dec(t.net))+'</td>' +
        '<td>'+(t.jobs?hm(t.jobs):"–")+'</td>' +
      "</tr>";
  });
  $("monthTable").innerHTML =
    '<table><thead><tr><th>Tag</th><th>Kommen</th><th>Gehen</th><th>Pause</th><th>Arbeitszeit</th><th>Dezimal</th><th>Aufträge</th></tr></thead>' +
    "<tbody>"+rows+"</tbody>" +
    '<tfoot><tr><td>'+list.length+(list.length===1?' Tag':' Tage')+'</td><td></td><td></td><td>'+hm(sumBr)+'</td><td>'+hm(sumNet)+'</td><td>'+dec(sumNet)+'</td><td>'+hm(sumJobs)+'</td></tr></tfoot></table>';
}

/* ---------------- Eingaben ---------------- */
document.addEventListener("input", function(e){
  var el = e.target, d = day(current);

  if(el.id === "date"){ if(el.value){ current = el.value; renderAll(); } return; }
  if(el.id === "note"){ d.note = el.value; save(); return; }

  if(el.dataset.field){ d[el.dataset.field] = el.value; save(); renderSums(); renderMonth(); return; }

  if(el.dataset.break !== undefined){
    d.breaks[+el.dataset.break][el.dataset.key] = el.value;
    save(); renderSums(); renderMonth();
    var open = d.breaks.some(function(b){ return b.from && !b.to; });
    $("pauseToggle").textContent = open ? "Pause beenden" : "Pause starten";
    $("pauseToggle").className = open ? "btn warn" : "btn";
    return;
  }

  if(el.dataset.job !== undefined){
    var j = d.jobs[+el.dataset.job], k = el.dataset.key;
    j[k] = el.value;
    if(k==="start" || k==="end"){          // von Hand geändert -> gestoppte Sekunden verwerfen
      if(j.running){ j.running = false; j.startedAt = null; }
      delete j.sec;
      var cell = document.querySelector('[data-dur="'+el.dataset.job+'"]');
      if(cell) cell.textContent = jobDurText(j);
    }
    save(); renderSums(); renderTicker(); renderMonth();
    return;
  }
});

document.addEventListener("click", function(e){
  var el = e.target.closest("button");
  if(!el) return;
  var d = day(current);

  if(el.dataset.now){ d[el.dataset.now] = nowHM(); save(); renderAll(); return; }

  if(el.dataset.nowbreak !== undefined){
    d.breaks[+el.dataset.nowbreak][el.dataset.key] = nowHM(); save(); renderAll(); return;
  }
  if(el.dataset.delbreak !== undefined){
    d.breaks.splice(+el.dataset.delbreak,1);
    if(!d.breaks.length) d.breaks.push({from:"",to:""});
    save(); renderAll(); return;
  }
  if(el.dataset.deljob !== undefined){
    var jd = d.jobs[+el.dataset.deljob];
    var label = [jd.customer, jd.task].filter(Boolean).join(" · ") || "diesen Auftrag";
    if(confirm("„"+label+"“ löschen?")){ d.jobs.splice(+el.dataset.deljob,1); save(); renderAll(); }
    return;
  }
  if(el.dataset.toggle !== undefined){
    var j = d.jobs[+el.dataset.toggle];
    if(j.running){ finishJob(j); }
    else{
      stopAllRunning();                    // immer nur ein Auftrag gleichzeitig
      j.running = true; j.startedAt = Date.now(); j.start = nowHM(); j.end = ""; delete j.sec;
      if(!d.start) d.start = nowHM();      // erster Start stempelt den Tag ein
    }
    writeNow(); renderAll(); return;       // Stempelzeiten nie verzögert speichern
  }

  switch(el.id){
    case "prevDay": shiftDay(-1); break;
    case "nextDay": shiftDay(1); break;
    case "todayBtn": current = isoToday(); renderAll(); break;
    case "addBreak": d.breaks.push({from:"",to:""}); save(); renderAll(); break;
    case "pauseToggle": togglePause(d); break;
    case "addJob": addJob(d); break;
    case "clearDay": clearDay(); break;
    case "csvDays": exportDays(); break;
    case "csvJobs": exportJobs(); break;
    case "backup": exportBackup(); break;
    case "restoreBtn": $("restoreFile").click(); break;
    case "themeBtn": cycleTheme(); break;
  }
});

function shiftDay(n){
  var dt = parseISO(current);
  dt.setDate(dt.getDate()+n);
  current = isoOf(dt);
  renderAll();
}
function togglePause(d){
  var open = null;
  d.breaks.forEach(function(b){ if(b.from && !b.to) open = b; });
  if(open){ open.to = nowHM(); }
  else{
    var free = null;
    d.breaks.forEach(function(b){ if(!free && !b.from && !b.to) free = b; });
    if(free) free.from = nowHM();
    else d.breaks.push({ from:nowHM(), to:"" });
  }
  save(); renderAll();
}
function addJob(d){
  d.jobs.push({ customer:"", birth:"", task:"", material:"", start:"", end:"", running:false, startedAt:null });
  save(); renderAll();
  var inputs = document.querySelectorAll('#jobs [data-key="customer"]');
  if(inputs.length) inputs[inputs.length-1].focus();
}
function clearDay(){
  if(!confirm("Alle Eintragungen vom "+current+" löschen?")) return;
  delete db.days[current];
  save(); renderAll();
}

/* ---------------- Sekundentakt ---------------- */
setInterval(function(){
  var r = runningJob();
  if(!r) return;
  var t = $("tickerTime");
  if(t) t.textContent = hms(jobSec(r.job));
  if(r.iso === current){
    var d = day(current);
    d.jobs.forEach(function(j,i){
      if(!j.running) return;
      var cell = document.querySelector('[data-dur="'+i+'"]');
      if(cell) cell.textContent = hms(jobSec(j));
    });
    renderSums();
  }
}, 1000);

/* ---------------- Export ---------------- */
function csvCell(v){
  v = String(v===undefined || v===null ? "" : v);
  return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function download(name, text, type){
  var blob = new Blob(["﻿"+text], { type:(type||"text/csv")+";charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function monthDays(){
  var ym = current.slice(0,7);
  return Object.keys(db.days).filter(function(iso){
    return iso.slice(0,7)===ym && !isEmptyDay(db.days[iso]);
  }).sort();
}
function deDate(iso){ var p=iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
function flat(s){ return String(s||"").replace(/\s*\n\s*/g, " · "); }

function exportDays(){
  var list = monthDays();
  if(!list.length) return alert("Für diesen Monat ist nichts erfasst.");
  var rows = [["Datum","Wochentag","Beginn","Ende","Pause (h)","Anwesend (h)","Arbeitszeit (h)","Arbeitszeit (dez.)","Auftragszeit (h)","Notiz"]];
  var sum = 0;
  list.forEach(function(iso){
    var d = db.days[iso], t = totals(d);
    sum += t.net || 0;
    rows.push([deDate(iso), WD[parseISO(iso).getDay()], d.start, d.end, hm(t.br), hm(t.att), hm(t.net), t.net===null?"":dec(t.net), hm(t.jobs), (d.note||"").replace(/\n/g," ")]);
  });
  rows.push([]);
  rows.push(["Summe","","","","","",hm(sum),dec(sum),"",""]);
  download("Zeiterfassung_"+current.slice(0,7)+".csv", rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n"));
}
function exportJobs(){
  var list = monthDays(), rows = [["Datum","Kunde","Geburtsdatum","Auftrag / Tätigkeit","Material","Von","Bis","Dauer (h)","Dauer (dez.)"]], sum = 0, n = 0;
  list.forEach(function(iso){
    db.days[iso].jobs.forEach(function(j){
      var min = jobSec(j)/60;
      sum += min; n++;
      rows.push([deDate(iso), j.customer, j.birth, flat(j.task), flat(j.material), j.start, j.end, hm(min), dec(min)]);
    });
  });
  if(!n) return alert("Für diesen Monat sind keine Aufträge erfasst.");
  rows.push([]);
  rows.push(["Summe","","","","","","",hm(sum),dec(sum)]);
  download("Auftraege_"+current.slice(0,7)+".csv", rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n"));
}
function exportBackup(){
  download("zeiterfassung-sicherung-"+isoToday()+".json", JSON.stringify(db,null,1), "application/json");
}
$("restoreFile").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var p = JSON.parse(fr.result);
      if(!p || !p.days) throw new Error("Datei enthält keine Zeitdaten.");
      if(!confirm("Sicherung laden? Die aktuellen Daten in diesem Browser werden ersetzt.")) return;
      db = p; save(); renderAll();
    }catch(err){
      alert("Datei konnte nicht gelesen werden: " + err.message);
    }
  };
  fr.readAsText(file);
  e.target.value = "";
});

/* ---------------- Ansicht hell/dunkel ---------------- */
var TKEY = "zeiterfassung.theme";
function applyTheme(){
  var t = localStorage.getItem(TKEY);
  if(t==="dark" || t==="light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  $("themeBtn").textContent = "Ansicht: " + (t==="dark" ? "Dunkel" : t==="light" ? "Hell" : "Automatisch");
}
function cycleTheme(){
  var t = localStorage.getItem(TKEY);
  var next = t==="light" ? "dark" : t==="dark" ? "" : "light";
  if(next) localStorage.setItem(TKEY, next); else localStorage.removeItem(TKEY);
  applyTheme();
}

/* ---------------- Start ---------------- */
load();
applyTheme();
renderAll();
})();
</script>
</body>
</html>
